<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="1" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Frame target corners -->
  <path d="M 120 170 L 120 130 A 10 10 0 0 1 130 120 L 170 120" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M 392 170 L 392 130 A 10 10 0 0 0 382 120 L 342 120" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M 120 342 L 120 382 A 10 10 0 0 0 130 392 L 170 392" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M 392 342 L 392 382 A 10 10 0 0 1 382 392 L 342 392" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Barcode Bars -->
  <rect x="160" y="180" width="16" height="152" rx="4" fill="#ffffff" />
  <rect x="190" y="180" width="10" height="152" rx="4" fill="#ffffff" />
  <rect x="214" y="180" width="24" height="152" rx="4" fill="#ffffff" />
  <rect x="252" y="180" width="10" height="152" rx="4" fill="#ffffff" />
  <rect x="276" y="180" width="30" height="152" rx="4" fill="#ffffff" />
  <rect x="320" y="180" width="14" height="152" rx="4" fill="#ffffff" />
  <rect x="348" y="180" width="8" height="152" rx="4" fill="#ffffff" />

  <!-- Laser Line -->
  <rect x="110" y="250" width="292" height="12" rx="6" fill="#f87171" opacity="0.9" />
  <rect x="130" y="253" width="252" height="6" rx="3" fill="#ffffff" />
</svg>
