    <script>
      // Suppress harmless Vite dev HMR WebSocket disconnects in AI Studio dev preview
      (function() {
        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var str = String(arguments[i]);
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1) {
              return;
            }
          }
          origError.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('vite') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
